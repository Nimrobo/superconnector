name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      # Trusted Publishing requires npm >= 11.5.1; Node 20 ships an older npm.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      # Auth is via OIDC (Trusted Publishing) — no NPM_TOKEN needed.
      # Provenance is generated automatically when publishing this way.
      # SDK must publish before the CLI, which depends on it.
      - run: npm publish --workspace @nimrobo/superconnector --access public
      - run: npm publish --workspace @nimrobo/superconnector-cli --access public
